{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{if .Title}}{{.Title}} · pec{{else}}pec{{end}}</title>
  <link rel="stylesheet" href="/report.css?v={{.Assets}}">
  <link rel="stylesheet" href="/static/css/app.css?v={{.Assets}}">
  <meta name="htmx-config" content='{"noSwap": [204, 304, "5xx"]}'>
  <script src="/static/js/htmx.min.js?v={{.Assets}}" defer></script>
</head>
<body>
  {{template "nav" .}}
  <main>
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    {{block "content" .}}{{end}}
  </main>
  <footer>pec {{.Version}} · reads files, writes files, never touches the mount</footer>
  <div id="toast" aria-live="polite"></div>
  <script>
    document.body.addEventListener("showToast", e => {
      const el = document.createElement("div");
      el.className = "toast";
      el.textContent = e.detail.msg;
      document.getElementById("toast").appendChild(el);
      setTimeout(() => el.remove(), 2500);
    });
  </script>
</body>
</html>{{end}}

{{define "problem"}}<div class="error">{{.Error}}</div>{{end}}
