{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{if .Title}}{{.Title}} · pec{{else}}pec{{end}}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <meta name="htmx-config" content='{"noSwap": [204, 304, "5xx"]}'>
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body>
  {{template "nav" .}}
  <main>
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    {{block "content" .}}{{end}}
  </main>
  <footer>pec {{.Version}} · reads files, writes files, never touches the mount</footer>
</body>
</html>{{end}}

{{define "problem"}}<div class="error">{{.Error}}</div>{{end}}
